# A person working out on a yoga mat, with loose cubes around them.
#
# The person never leaves the mat, so this scenario isolates one question: what do
# the lidar and the detector make of two legs that move while their owner does not
# translate? `routine` cycles the moves, so a single run covers jumping jacks, then
# marching leg lifts, then side bends, rather than one repeated pose.
#
# Use `fear_hri_brick_carry` for the version where the person also walks into the
# robot's path.
scenario:
  name: exercise_mat_stationary
  actors:
    - id: 1
      name: exercising_person
      kind: human
      body_name: sim_human_0
      is_subject: true
      visible_to_lidar: true
      pose:
        x: 0.55
        y: 1.45
        z: 0.0
        yaw: -1.5707963267948966   # facing south, down the room
      motion:
        mode: static
      gait:
        mode: routine
        period: 1.4
        routine: [jacks, march, side_bend, step_touch]
        routine_reps: 5
        leg_spread_deg: 28
        leg_swing_deg: 34
        arm_raise_deg: 95
        arm_swing_deg: 55
        torso_bend_deg: 20

  props:
    - id: 1
      name: exercise_mat
      kind: mat
      body_name: sim_mat_0
      pose: {x: 0.55, y: 1.45, z: 0.0, yaw: 0.0}
      size: [1.73, 0.61]          # a yoga mat, long axis along x

    - id: 2
      name: cube_a
      kind: cube
      body_name: sim_cube_0
      pose: {x: -0.60, y: 0.35, yaw: 0.0}
      size: 0.07
      mass: 0.15

    - id: 3
      name: cube_b
      kind: cube
      body_name: sim_cube_1
      pose: {x: -0.30, y: -0.45, yaw: 0.4}
      size: 0.07
      mass: 0.15

    - id: 4
      name: cube_c
      kind: cube
      body_name: sim_cube_2
      pose: {x: 0.35, y: -0.85, yaw: 0.0}
      size: 0.07
      mass: 0.15
