# PlayStation DualShock 4 via the in-kernel hid-sony driver.
#
# The face buttons are NOT in Xbox order: hid-sony reports Cross, Circle,
# Triangle, Square as 0..3, so Triangle lands on index 2 where an Xbox pad
# has X. The names below are the mecanumbot-side semantic names, mapped to
# the DS4 indices that carry the equivalent button -- which is exactly what
# the two-level indirection exists for. The physical labels are noted per
# line.
#
# If the pad is driven through ds4drv rather than hid-sony it enumerates
# differently and generic.yaml is the better match.

profile:
  name: ps4
  description: "DualShock 4 via hid-sony"

  match:
    axes: 8
    buttons: 13

  limits:
    max_lin_vel: 0.234
    max_ang_vel: 1.092
    deadzone: 0.06
    lin_step: 0.02
    ang_step: 0.10
    publish_hz: 20.0
    joy_timeout: 0.5
    zero_hold_ticks: 5
    accessory_keepalive_hz: 1.0

  accessory:
    neck:
      min: 2.0
      max: 8.6
      default: 8.6
      step: 0.15
    gripper:
      min: 1.6
      front: 5.12
      max: 8.54
      default: 5.12

  axes:
    left_x:  {index: 0}
    left_y:  {index: 1}
    right_x: {index: 3}
    right_y: {index: 4}
    # L2 / R2 rest at -1.0 and read +1.0 fully pressed.
    lt: {index: 2, range: [-1.0, 1.0]}
    rt: {index: 5, range: [-1.0, 1.0]}

  dpad:
    source: axes
    x_axis: 6
    y_axis: 7

  buttons:
    A: 0        # Cross
    B: 1        # Circle
    Y: 2        # Triangle
    X: 3        # Square
    LB: 4       # L1
    RB: 5       # R1
    LT_BTN: 6   # L2 as a digital button
    RT_BTN: 7   # R2 as a digital button
    BACK: 8     # Share
    START: 9    # Options
    GUIDE: 10   # PS
    LS: 11      # L3
    RS: 12      # R3

  bindings:
    drive:  {control: axis, axis: left_y}
    strafe: {control: axis, axis: left_x}
    turn:   {control: axis, axis: right_x}

    neck_up:     {control: button, button: Y,  trigger: hold}
    neck_down:   {control: button, button: A,  trigger: hold}
    neck_preset: {control: button, button: LS, trigger: press, value: 8.6}

    gripper_open:  {control: button, button: X, trigger: press}
    gripper_close: {control: button, button: B, trigger: press}

    estop:      {control: button, button: BACK,  trigger: press}
    led_preset: {control: button, button: START, trigger: press, preset: attention}

  # mode:  1 wave right, 2 wave left, 3 pulse, 4 solid,
  #        5 fast blink, 6 slow blink
  # color: 0 black, 1 white, 2 green, 3 red, 4 blue, 5 cyan, 6 pink, 7 yellow
  led_presets:
    blank:
      fl: {mode: 4, color: 0}
      fr: {mode: 4, color: 0}
      bl: {mode: 4, color: 0}
      br: {mode: 4, color: 0}
    attention:
      fl: {mode: 5, color: 1}
      fr: {mode: 5, color: 1}
      bl: {mode: 5, color: 1}
      br: {mode: 5, color: 1}
    ready:
      fl: {mode: 4, color: 2}
      fr: {mode: 4, color: 2}
      bl: {mode: 4, color: 2}
      br: {mode: 4, color: 2}
