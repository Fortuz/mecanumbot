# High resolution configuration for detailed imaging
# Resolution: 1280x720 @ 30fps
# Use case: High-quality recording, detailed inspection, AR/VR applications

camera_image_publisher_node:
  ros__parameters:
    camera_backend: auto
    device: /dev/video0
    topic_name: /camera/image_raw
    frame_id: camera_optical_frame
    encoding: bgr8

    width: 1280
    height: 720
    fps: 30.0

    csi_sensor_id: 0
    csi_flip_method: 0
    csi_gstreamer_pipeline: ""

    queue_size: 10
    reopen_delay_sec: 2.0
    use_capture_thread: true
    publish_fps: 30.0
