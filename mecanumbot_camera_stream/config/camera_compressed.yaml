# JPEG compressed streaming configuration
# Resolution: 640x480 @ 15fps with 80% JPEG quality
# Use case: Remote viewing, bandwidth-sensitive applications, network streaming
# Bandwidth: ~500KB/s (10-20x reduction vs raw)

compressed_camera_publisher_node:
  ros__parameters:
    camera_backend: csi
    device: /dev/video0
    topic_name: /camera/image_raw/compressed
    frame_id: camera_optical_frame

    width: 640
    height: 480
    #width: 1536
    #height: 864
    fps: 30.0

    format: jpeg
    jpeg_quality: 80
    png_level: 3

    csi_sensor_id: 0
    csi_flip_method: 2
    csi_gstreamer_pipeline: ""

    queue_size: 5
    reopen_delay_sec: 2.0
    use_capture_thread: true
    publish_fps: 15.0
