# H.264 hardware-accelerated HIGH QUALITY streaming
# Resolution: 1280x720 @ 30fps with 4Mbps bitrate
# Use case: High quality video recording with efficient compression
# Bandwidth: ~500KB/s (50x reduction vs raw)

h264_camera_publisher_node:
  ros__parameters:
    device: /dev/video0
    topic_name: /camera/image_raw/h264
    frame_id: camera_optical_frame

    width: 1280
    height: 720
    fps: 30.0
    bitrate: 4000000

    hardware_encoder: auto
    custom_pipeline: ""

    queue_size: 5
