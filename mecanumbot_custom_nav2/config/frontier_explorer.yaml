# Constants for the autoslam frontier explorer (T1).
#
# The node name has to match the key: it registers as
# `mecanumbot_frontier_explorer`, and a renamed node silently gets none of this
# -- the same trap the perception package's config has.

mecanumbot_frontier_explorer:
  ros__parameters:

    # ----- Topics and rate ----------------------------------------------------
    map_topic: /map

    # Where the robot's own position comes from. T1 runs under slam_toolbox,
    # which publishes map -> odom but no /amcl_pose, so the default reads the
    # transform tree; set `amcl` to run this node against a saved map instead.
    pose_source: tf
    map_frame: map
    base_frame: mecanumbot/base_link
    pose_topic: /amcl_pose
    # The server's comparison verdict. Nothing publishes this yet on the robot;
    # with no verdict arriving, set `require_cloud: false` below or T1 will
    # never satisfy its exit criteria.
    agreement_topic: /mecanumbot/deep3r/map_agreement
    finished_topic: exploration/finished
    state_topic: exploration/state
    marker_topic: exploration/frontiers
    nav2_action: /navigate_to_pose

    # Detection cycles per second. Each cycle grows both RRTs by
    # `rrt_*_iterations` steps, so this and those two set the CPU cost together.
    # 1 Hz against a 5 s map update is already several cycles per new map.
    rate: 1.0

    # ----- Reading the occupancy grid ------------------------------------------
    # slam_toolbox publishes -1 unknown and a percentage otherwise. These are the
    # same numbers nav2's costmaps use, so the explorer and the planner agree
    # about what is drivable.
    free_threshold: 25
    occupied_threshold: 65

    # ----- The RRT -------------------------------------------------------------
    # One growth step, in metres. Roughly the robot's stopping distance: shorter
    # and the tree needs many more iterations to reach anywhere, longer and it
    # steps over the doorways that are exactly what it should be finding.
    rrt_step_size: 1.0

    # How far from where a branch stopped a real free/unknown boundary has to
    # be for the stop to count as a frontier. About two map cells at 0.05 m plus
    # slack for the rasterisation.
    rrt_snap_radius: 0.5

    # Growth steps per cycle for each tree. The global tree gets more because it
    # is covering the whole map; the local one is restarted every cycle and only
    # has `rrt_local_radius` metres to fill.
    rrt_global_iterations: 60
    rrt_local_iterations: 30
    rrt_local_radius: 5.0

    # 0 means a fresh random seed every run. Set a non-zero value to make a run
    # reproducible, which is what a recorded trial wants.
    rrt_seed: 0

    # ----- From candidates to a goal -------------------------------------------
    # Candidates closer together than this are the same frontier detected twice.
    cluster_radius: 0.6
    # How far from a cluster centroid a real frontier cell may be for the
    # cluster to survive revalidation.
    revalidate_radius: 0.4

    # Information gain is the count of unobserved cells within this radius of a
    # frontier -- how much the robot would learn by going there. Around the
    # lidar's useful indoor range for a doorway rather than its 12 m maximum,
    # because gain that is only realised from across the room is gain the robot
    # will not actually collect from the goal it is sent to.
    gain_radius: 1.5

    # score = gain_weight * (gain / largest gain) - cost_weight * distance.
    # Gain is normalized per batch, so cost_weight is read directly as "score
    # per metre": 0.4 means the nearest frontier wins unless one 2.5 m further
    # away has the full normalized gain.
    gain_weight: 1.0
    cost_weight: 0.4

    # Unobserved cells below which a frontier is not worth a drive at all. At
    # 0.05 m resolution, 8 cells is 0.02 m^2 -- the single-cell boundaries that
    # line every rasterised wall and can never be resolved.
    min_gain: 8

    # Added to the score of the frontier nearest the goal already being driven
    # to. Without it the explorer re-decides at `rate` and oscillates between
    # two equally good frontiers, driving to neither.
    hysteresis: 0.25
    hysteresis_radius: 1.0

    # How long one goal may run before it is cancelled and the choice remade.
    goal_timeout: 60.0
    # Close enough to count as having arrived, without waiting for nav2 to
    # finish parking on a point that has no meaningful orientation.
    goal_reached_distance: 0.6

    # ----- Servicing the server's uncertain regions -----------------------------
    # The feedback path to the reconstruction: go and look again at the places
    # the comparison is least sure about. This is view planning, not a
    # correction to either map.
    #
    # *Which* regions are worth a look, and when one counts as looked at, are
    # `mecanumbot_map_agreement`'s -- it publishes the list on
    # `deep3r/revisit_regions` and the same policy has to hold in T2, when this
    # explorer is not running. Set its own constants in
    # `config/map_agreement.yaml`.
    revisit_uncertain: true

    # The revisit list, published by the agreement handler.
    revisit_topic: /mecanumbot/deep3r/revisit_regions

    # One uncertain region for every N goals. Interleaved rather than
    # prioritised: servicing them first stalls exploration behind a
    # reconstruction that keeps finding new things to complain about.
    uncertain_every: 3

    # ----- Exit criteria -------------------------------------------------------
    # See exit_criteria.py for why the rule has the shape it does:
    #   finished = (FRONTIERS or GAIN) and STABLE and CLOUD, or BUDGET

    # Windows the two rates are measured over.
    progress_window: 45.0
    cloud_window: 60.0

    # 1. FRONTIERS -- how long the detector has to find nothing. The RRT is
    # stochastic and draws a blank on plenty of cycles where frontiers plainly
    # remain, so a single empty cycle means nothing.
    frontier_quiet_time: 20.0

    # 2. GAIN -- newly-observed cells per metre driven, below which the map has
    # stopped filling in. Per metre and not per second so that a robot standing
    # still waiting for a plan contributes no evidence either way. 25 cells/m at
    # 0.05 m resolution is a strip about 0.06 m^2 per metre driven -- an order
    # of magnitude below what driving down an unmapped corridor produces.
    min_cells_per_metre: 25.0

    # 3. STABLE -- fractional growth of the known area over the window, and how
    # long to wait after a loop closure. slam_toolbox re-rasterises the whole
    # grid on a closure and a fresh crop of frontiers appears a second later;
    # exiting into that is how a run ends with half a map.
    max_map_growth: 0.01
    loop_closure_settle: 15.0

    # 4. CLOUD -- the reconstruction's own half. The 2D map is the means, the
    # cloud is the product, so a finished map over an unfinished cloud is a
    # failed T1 that looks like a successful one.
    #
    # `min_agreement` is the load-bearing one, and it is not about coverage at
    # all: it is the share of cloud-occupied cells the map also calls occupied,
    # i.e. whether the reconstruction is placed where the room is. A fully
    # explored grid over a cloud that was never placed is a failed T1 that
    # looks exactly like a good one from the 2D data, and it surfaces an hour
    # into T2 as "the detector never sees anything". Matches the server's
    # seek.t1_min_agreement.
    min_agreement: 0.15
    # And do not finish just after CUT3R restarted, for the same reason
    # loop_closure_settle exists on the map side: the cloud T2 searches would
    # have been built from whatever fraction of the drive came after the reset.
    cloud_reset_settle: 30.0
    min_grid_coverage: 0.75
    max_uncertain_regions: 3
    uncertain_score_threshold: 0.5
    max_cloud_growth: 0.02
    cloud_verdict_timeout: 30.0
    # Set false to run the explorer with no server at all -- mapping only. Then
    # T1 ends on the 2D criteria alone, which is the right thing for a dry run
    # and the wrong thing for a trial.
    require_cloud: true

    # 5. BUDGET -- 0 disables a limit. Not quality criteria; they are what stops
    # an unattended run. A flat battery mid-reconstruction loses the whole
    # session, because the cloud lives on the server against a map_id that will
    # not survive the robot coming back.
    max_duration: 900.0
    max_distance: 0.0
    min_battery_voltage: 0.0
    # The floor, which no criterion above supplies: every quality test can be
    # satisfied within seconds of start-up by a robot that has not moved yet --
    # no frontiers found, no movement to measure gain over, a map trivially not
    # growing. The budget still overrides this, because an unattended run has to
    # be able to stop. Matches the server's seek.t1_min_runtime_s.
    min_runtime: 60.0
